<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GreenGrow | Create Account</title>
      <link rel="icon" type="image/png" href="images/logo-1.png">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- Google Font -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap"
          rel="stylesheet">


  <link rel="stylesheet" href="signup.css">



   

</head>


<body data-theme="light">



    <main class="gg-signup-page">


        <!-- Background decoration -->

        <div class="gg-signup-bg"></div>


        <div class="gg-signup-controls">


            <!-- RTL -->

            <button
                type="button"
                class="gg-signup-control"
                id="rtlToggle"
                aria-label="Switch RTL"
                title="RTL / LTR"
            >

               <i class="bi bi-arrow-left-right"></i>

            </button>


            <!-- DARK MODE -->

            <button
                type="button"
                class="gg-signup-control"
                id="themeToggle"
                aria-label="Dark mode"
                title="Dark mode"
            >

                <i
                    class="bi bi-moon-stars-fill"
                    id="themeIcon">
                </i>

            </button>


        </div>

        <section class="gg-signup-card">


            <!-- LOGO -->

            <a
                href="index.html"
                class="gg-signup-logo"
                aria-label="GreenGrow Home"
            >

                <img
                    src="images/logo-1.png"
                    alt="GreenGrow"
                >

            </a>


            <!-- HEADING -->

            <div class="gg-signup-heading">


                <div class="gg-signup-eyebrow">

                    <span></span>

                    JOIN GREENGROW

                    <span></span>

                </div>


                <h1>

                    Create Your
                    <span>Account.</span>

                </h1>


                <p>

                    Create your GreenGrow account and start
                    exploring smarter hydroponic and vertical
                    farming solutions.

                </p>


            </div>


            <form
                class="gg-signup-form"
                id="ggSignupForm"
            >


                <!-- FIRST + LAST NAME -->

                <div class="gg-signup-row">


                    <!-- FIRST NAME -->

                    <div class="gg-signup-field">


                        <label for="ggFirstName">

                            First Name

                        </label>


                        <div class="gg-signup-input-wrap">


                            <i
                                class="bi bi-person gg-signup-input-icon">
                            </i>


                            <input
                                type="text"
                                id="ggFirstName"
                                class="gg-signup-input"
                                placeholder="First name"
                                autocomplete="given-name"
                                required
                            >


                        </div>


                    </div>


                    <!-- LAST NAME -->

                    <div class="gg-signup-field">


                        <label for="ggLastName">

                            Last Name

                        </label>


                        <div class="gg-signup-input-wrap">


                            <i
                                class="bi bi-person-vcard gg-signup-input-icon">
                            </i>


                            <input
                                type="text"
                                id="ggLastName"
                                class="gg-signup-input"
                                placeholder="Last name"
                                autocomplete="family-name"
                                required
                            >


                        </div>


                    </div>


                </div>


                <!-- EMAIL -->

                <div class="gg-signup-field">


                    <label for="ggSignupEmail">

                        Email Address

                    </label>


                    <div class="gg-signup-input-wrap">


                        <i
                            class="bi bi-envelope gg-signup-input-icon">
                        </i>


                        <input
                            type="email"
                            id="ggSignupEmail"
                            class="gg-signup-input"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >


                    </div>

                </div>


                <!-- PHONE -->

                <div class="gg-signup-field">


                    <label for="ggSignupPhone">

                        Phone Number

                    </label>


                    <div class="gg-signup-input-wrap">


                        <i
                            class="bi bi-telephone gg-signup-input-icon">
                        </i>


                        <input
                            type="tel"
                            id="ggSignupPhone"
                            class="gg-signup-input"
                            placeholder="Enter your phone number"
                            autocomplete="tel"
                        >


                    </div>

                </div>


                <!-- PASSWORD ROW -->

                <div class="gg-signup-row">


                    <!-- PASSWORD -->

                    <div class="gg-signup-field">


                        <label for="ggSignupPassword">

                            Password

                        </label>


                        <div class="gg-signup-input-wrap">


                            <i
                                class="bi bi-lock gg-signup-input-icon">
                            </i>


                            <input
                                type="password"
                                id="ggSignupPassword"
                                class="gg-signup-input"
                                placeholder="Create password"
                                autocomplete="new-password"
                                required
                            >


                            <button
                                type="button"
                                class="gg-signup-password-toggle"
                                id="ggPasswordToggle"
                                aria-label="Show password"
                            >

                                <i
                                    class="bi bi-eye"
                                    id="ggPasswordIcon">
                                </i>

                            </button>


                        </div>


                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="gg-signup-field">


                        <label for="ggSignupConfirmPassword">

                            Confirm Password

                        </label>


                        <div class="gg-signup-input-wrap">


                            <i
                                class="bi bi-shield-lock gg-signup-input-icon">
                            </i>


                            <input
                                type="password"
                                id="ggSignupConfirmPassword"
                                class="gg-signup-input"
                                placeholder="Confirm password"
                                autocomplete="new-password"
                                required
                            >


                            <button
                                type="button"
                                class="gg-signup-password-toggle"
                                id="ggConfirmPasswordToggle"
                                aria-label="Show password"
                            >

                                <i
                                    class="bi bi-eye"
                                    id="ggConfirmPasswordIcon">
                                </i>

                            </button>


                        </div>


                    </div>


                </div>


                <!-- TERMS -->

                <label class="gg-signup-terms">


                    <input
                        type="checkbox"
                        id="ggSignupTerms"
                        required
                    >


                    <span>

                        I agree to the
                        <a href="terms.html">
                            Terms & Conditions
                        </a>
                        and
                        <a href="privacy.html">
                            Privacy Policy
                        </a>.

                    </span>


                </label>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="gg-signup-submit"
                    id="ggSignupSubmit"
                >

                    <span id="ggSignupButtonText">

                        Create Account

                    </span>


                    <i class="bi bi-arrow-right"></i>

                </button>


                <!-- DIVIDER -->

                <div class="gg-signup-divider">

                    ALREADY A MEMBER?

                </div>


                <!-- LOGIN -->

                <div class="gg-signup-login">

                    <span>

                        Already have an account?

                    </span>


                    <a href="login.html">

                        Sign In

                    </a>

                </div>


                <!-- SECURITY -->

                <div class="gg-signup-security">

                    <i class="bi bi-shield-check"></i>

                    <span>

                        Your information is protected and secure.

                    </span>

                </div>


            </form>


        </section>


    </main>




    <script src="signup.js">  </script>


        
   

</body>

</html>
